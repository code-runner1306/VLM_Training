[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-training"
version = "0.1.0"
description = "VLM Training & Synthetic Annotation Pipeline with QLoRA, Early Stopping, and Multi-Model Evaluation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=4.45.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.26.0",
    "datasets>=2.14.0",
    "pillow>=10.0.0",
    "opencv-python-headless>=4.8.0",
    "einops>=0.7.0",
    "timm>=0.9.0",
    "qwen-vl-utils>=0.0.8",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "google-genai>=0.1.1",
    "openai>=1.12.0",
    "groq>=0.4.0",
    "ollama>=0.1.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.18.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "huggingface-hub>=0.20.0",
    "psutil>=5.9.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.optional-dependencies]
cuda = [
    "triton>=2.2.0; sys_platform == 'linux'",
    "deepspeed>=0.14.0; sys_platform == 'linux'",
    "decord>=0.6.0; sys_platform == 'linux'",
    "pynvml>=11.5.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools.packages.find]
where = ["."]

# PyTorch builds: pyproject defaults to CPU wheels. For CUDA builds, install via
# requirements.txt (which pins the cu121 index) instead.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

