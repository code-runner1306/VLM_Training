[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-training"
version = "0.1.0"
description = "VLM Training & Synthetic Annotation Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=0.1.1",
    "openai>=1.12.0",
    "groq>=0.4.0",
    "ollama>=0.1.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.18.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "transformers>=4.45.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "accelerate>=0.26.0",
    "datasets>=2.14.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pandas>=2.0.0",
    "huggingface-hub>=0.20.0",
    "qwen-vl-utils>=0.0.8",
    "psutil>=5.9.0",
]

[tool.setuptools.packages.find]
where = ["."]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

