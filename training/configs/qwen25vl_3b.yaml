# Configuration for Qwen2.5-VL-3B-Instruct

model:
  key: "qwen25vl_3b"
  model_id: "Qwen/Qwen2.5-VL-3B-Instruct"

hardware_profile: "8GB"

quantization:
  enabled: true
  bits: 4
  quant_type: "nf4"
  double_quant: true
  compute_dtype: "bfloat16" # falls back to float16 if unsupported

adaptation:
  strategy: "llm_projector" # Options: llm_only, llm_projector, full_multimodal
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05

image:
  min_pixels: 200704  # 256 * 28 * 28
  max_pixels: 1003520 # 1280 * 28 * 28

training:
  batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  num_epochs: 5
  weight_decay: 0.01
  gradient_checkpointing: true
  fp16: false
  bf16: true
  logging_steps: 10
  eval_steps: 50
  save_steps: 50
  max_grad_norm: 1.0

early_stopping:
  enabled: true
  monitor: "val_loss"
  mode: "min"
  patience: 2
  min_delta: 0.001
  restore_best_weights: true
  stopping_threshold: null
  divergence_threshold: 50.0

checkpoint:
  output_dir: "checkpoints/qwen25vl-3b"
  save_total_limit: 3
