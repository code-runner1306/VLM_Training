# Registry of supported VLM architectures and defaults

models:
  scold:
    name: "SCOLD Agricultural Encoder"
    model_id: "SCOLD/SCOLD-Agricultural-Disease"
    adapter_class: "SCOLDAdapter"
    default_vram_profile: "4GB"
    default_adaptation_strategy: "full_multimodal"
    target_modules:
      vision: ["visual.encoder", "projection_head"]

  qwen3vl:
    name: "Qwen3-VL 8B-class"
    model_id: "Qwen/Qwen3-VL-8B-Instruct"
    adapter_class: "Qwen3VLAdapter"
    default_vram_profile: "32GB"
    default_adaptation_strategy: "full_multimodal"
    image_token_budget:
      min_pixels: 200704
      max_pixels: 1254400
    target_modules:
      llm: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
      projector: ["merger"]
      vision: ["visual.blocks"]

  internvl_8b:
    name: "InternVL2.5-8B"
    model_id: "OpenGVLab/InternVL2_5-8B"
    adapter_class: "InternVLAdapter"
    default_vram_profile: "32GB"
    default_adaptation_strategy: "llm_projector"
    target_modules:
      llm: ["q_proj", "k_proj", "v_proj", "o_proj"]
      projector: ["mlp1"]
      vision: ["vision_model"]

  qwen25vl_3b:
    name: "Qwen2.5-VL-3B-Instruct"
    model_id: "Qwen/Qwen2.5-VL-3B-Instruct"
    adapter_class: "Qwen25VLAdapter"
    default_vram_profile: "8GB"
    default_adaptation_strategy: "llm_projector"
    image_token_budget:
      min_pixels: 200704
      max_pixels: 1003520
    target_modules:
      llm: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
      projector: ["merger"]
      vision: ["visual.blocks"]
