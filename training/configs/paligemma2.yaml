# Configuration for Google PaliGemma 2 10B (448x448)

model:
  key: "paligemma2"
  model_id: "google/paligemma2-10b-pt-448"

hardware_profile: "32GB"

quantization:
  enabled: true
  bits: 4
  quant_type: "nf4"
  double_quant: true
  compute_dtype: "bfloat16"

adaptation:
  strategy: "llm_projector" # Options: llm_only, llm_projector, full_multimodal
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05

image:
  size: 448

training:
  batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 1.5e-4
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  num_epochs: 3
  weight_decay: 0.01
  gradient_checkpointing: true
  fp16: false
  bf16: true
  logging_steps: 10
  eval_steps: 50
  save_steps: 50
  max_grad_norm: 1.0

checkpoint:
  output_dir: "checkpoints/paligemma2-10b"
  save_total_limit: 3
