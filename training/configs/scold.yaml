# Configuration for SCOLD Agricultural Disease Classifier
model:
  key: "scold"
  model_id: "SCOLD/SCOLD-Agricultural-Disease"

hardware_profile: "4GB"

quantization:
  enabled: false
  bits: 16
  compute_dtype: "bfloat16"

adaptation:
  strategy: "full_multimodal"
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05

training:
  batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 3.0e-4
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  num_epochs: 5
  weight_decay: 0.01
  gradient_checkpointing: false
  fp16: false
  bf16: true
  logging_steps: 10
  eval_steps: 50
  save_steps: 50
  max_grad_norm: 1.0

early_stopping:
  enabled: true
  monitor: "val_loss"
  mode: "min"
  patience: 2
  min_delta: 0.001
  restore_best_weights: true
  stopping_threshold: null
  divergence_threshold: 50.0

checkpoint:
  output_dir: "checkpoints/scold"
  save_total_limit: 3
